name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ["1.27"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -coverprofile coverage.out ./...

      - name: Check internal coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Show overall coverage for reference
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage (all packages): ${TOTAL}"

          # Enforce gate only on internal/ — root App.* methods require live Wails runtime
          go test -coverprofile internal.out ./internal/...
          INTERNAL=$(go tool cover -func=internal.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Internal package coverage: ${INTERNAL}%"
          if (( $(echo "$INTERNAL < 70" | bc -l) )); then
            echo "Internal coverage is below 70%!"
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate Wails v3 Bindings
        run: wails3 generate bindings

      - name: Build Application (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p build/bin
          go build -ldflags "-s -w" -o build/bin/sql-helper.exe .

      - name: Build Application (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p build/bin
          go build -ldflags "-s -w" -o build/bin/sql-helper .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sql-helper-${{ matrix.os }}
          path: build/bin/
          if-no-files-found: error