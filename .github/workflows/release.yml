name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
          cache: true

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate Wails v3 Bindings
        run: wails3 generate bindings

      - name: Build Windows EXE
        run: |
          mkdir -p build/bin
          go build -ldflags "-s -w -X main.CurrentVersion=${{ github.ref_name }}" -o build/bin/sql-helper-windows-amd64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/bin/sql-helper-windows-amd64.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}