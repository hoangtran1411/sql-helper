run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gofmt
    - ineffassign
    - unused
    - gosimple
    - typecheck
  disable:
    - depguard
    - goimports

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    enable-all: false
  gofmt:
    simplify: true

issues:
  exclude-rules:
    # Exclude test files from some checks
    - path: _test\.go
      linters:
        - errcheck
        - govet
    # Exclude main.go from some checks
    - path: main\.go
      linters:
        - gochecknoglobals
  max-issues-per-linter: 50
  max-same-issues: 10
