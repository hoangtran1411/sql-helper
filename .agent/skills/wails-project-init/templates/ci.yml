# =============================================================================
# CI Workflow for Go + Wails Applications
# =============================================================================
# Tested and verified on: Ubuntu, Windows, macOS
# Last updated: 2026-01-22
#
# IMPORTANT NOTES:
# 1. Use SPACE (not =) for -coverprofile and -covermode flags (Windows PowerShell fix)
# 2. Linux requires webkit2_41 tag for Ubuntu 22.04+ (libwebkit2gtk-4.1)
# 3. Race detector works on all platforms with this syntax
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # CRITICAL: Use SPACE instead of = for flags to avoid Windows PowerShell parsing issues
      # The = syntax causes PowerShell to interpret ".out" as a separate package name
      - name: Run tests with coverage
        run: go test -v -race -coverprofile coverage.out -covermode atomic ./internal/...

      - name: Check coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          # Fail if coverage is below 60% (adjust as needed)
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "Coverage is below 60%!"
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          # For private repos, add: token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Ubuntu 22.04+ uses libwebkit2gtk-4.1, requires webkit2_41 build tag
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # CRITICAL: Use -tags webkit2_41 (not webkit2gtk_4.1) for Ubuntu 22.04+
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: wails build -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Build (non-Linux)
        if: matrix.os != 'ubuntu-latest'
        run: wails build -platform ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: {{PROJECT_NAME}}-${{ matrix.os }}
          path: build/bin/
          if-no-files-found: error
