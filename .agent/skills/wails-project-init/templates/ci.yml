# =============================================================================
# CI Workflow for Go + Wails v3 Applications
# =============================================================================
# Tested and verified on: Ubuntu, Windows, macOS
#
# IMPORTANT NOTES:
# 1. Use SPACE (not =) for -coverprofile flag for Windows PowerShell compatibility
# 2. Wails v3 Linux uses GTK4 and WebKitGTK 6.0 (libgtk-4-dev libwebkitgtk-6.0-dev)
# 3. Generates bindings using `wails3 generate bindings` before building
# 4. Enforces 70% unit test coverage gate on internal/ business logic packages
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: "1.27"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -coverprofile coverage.out ./...

      - name: Check internal coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage (all packages): ${TOTAL}"

          go test -coverprofile internal.out ./internal/...
          INTERNAL=$(go tool cover -func=internal.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Internal package coverage: ${INTERNAL}%"
          if (( $(echo "$INTERNAL < 70" | bc -l) )); then
            echo "Internal coverage is below 70%!"
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate Wails v3 Bindings
        run: wails3 generate bindings

      - name: Build Application (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p build/bin
          go build -ldflags "-s -w" -o build/bin/{{PROJECT_NAME}}.exe .

      - name: Build Application (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p build/bin
          go build -ldflags "-s -w" -o build/bin/{{PROJECT_NAME}} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: {{PROJECT_NAME}}-${{ matrix.os }}
          path: build/bin/
          if-no-files-found: error
