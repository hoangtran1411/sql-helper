# =============================================================================
# Release Workflow for Go + Wails Applications
# =============================================================================
# Tested and verified on: Ubuntu, Windows, macOS
# Last updated: 2026-01-22
#
# TRIGGERS: On push of tags matching v* (e.g., v1.0.0, v2.1.0-beta)
#
# IMPORTANT NOTES:
# 1. Linux requires webkit2_41 tag for Ubuntu 22.04+ (libwebkit2gtk-4.1)
# 2. Version is injected via ldflags from git tag name
# 3. Pin Wails version for reproducible builds
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"
  # Pin Wails version for reproducible builds
  WAILS_VERSION: "v2.9.2"

jobs:
  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: {{PROJECT_NAME}}-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            artifact_name: {{PROJECT_NAME}}-windows-amd64
          - os: macos-latest
            platform: darwin/universal
            artifact_name: {{PROJECT_NAME}}-darwin-universal
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pin Wails version for reproducible builds
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Ubuntu 22.04+ uses libwebkit2gtk-4.1-dev
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # CRITICAL: Use -tags webkit2_41 (not webkit2gtk_4.1) for Ubuntu 22.04+
      # Version is injected from git tag via ldflags
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: wails build -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-s -w -X main.CurrentVersion=${{ github.ref_name }}"

      - name: Build (non-Linux)
        if: matrix.os != 'ubuntu-latest'
        run: wails build -platform ${{ matrix.platform }} -ldflags "-s -w -X main.CurrentVersion=${{ github.ref_name }}"

      - name: Compress artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd build/bin
          tar -czvf ../../${{ matrix.artifact_name }}.tar.gz *

      - name: Compress artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd build/bin
          Compress-Archive -Path * -DestinationPath ../../${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip
          if-no-files-found: warn

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Debug: Show artifact structure
      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
