# =============================================================================
# Release Workflow for Go + Wails v3 Applications
# =============================================================================
# Tested and verified for direct single-executable deployment
#
# TRIGGERS: On push of tags matching v* (e.g., v1.0.0, v2.1.0)
#
# IMPORTANT NOTES:
# 1. Installs Wails v3 CLI (wails3) and generates bindings
# 2. Builds Windows single-binary executable with version injected via ldflags
# 3. Direct executable release matches in-app self-updater pattern
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.27"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate Wails v3 Bindings
        run: wails3 generate bindings

      - name: Build Windows EXE
        run: |
          mkdir -p build/bin
          go build -ldflags "-s -w -X main.CurrentVersion=${{ github.ref_name }}" -o build/bin/{{PROJECT_NAME}}-windows-amd64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/bin/{{PROJECT_NAME}}-windows-amd64.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
